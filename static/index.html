<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glinski's Hexagonal Chess</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 12px;
  }
  h1 { font-size: 1.4rem; color: #a0c4ff; }
  h1 a { color: inherit; text-decoration: none; }
  h1 a:hover { text-decoration: underline; }

  #topbar {
    display: flex; align-items: center; gap: 10px;
    width: 100%; max-width: 920px; margin-bottom: 8px;
  }
  #topbar h1 { flex: 1; margin: 0; }
  #menu-toggle {
    display: none;
    background: #0f3460; color: #a0c4ff;
    border: 1px solid #1a4a80; border-radius: 6px;
    font-size: 1.3rem; line-height: 1; padding: 6px 12px; cursor: pointer;
  }
  #menu-toggle:hover { background: #1a4a80; }

  #main {
    display: flex;
    flex-direction: row;
    gap: 16px;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    max-width: 920px;
  }
  #board-container { position: relative; }
  svg#board { display: block; }
  .hex-cell { cursor: pointer; transition: filter 0.1s; }
  .hex-cell:hover { filter: brightness(1.3); }
  .hex-bg { stroke: #333; stroke-width: 0.8; }
  .hex-piece {
    font-size: 28px;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    user-select: none;
  }
  .hex-label {
    font-size: 7px;
    fill: #666;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  #rightcol {
    display: flex; flex-direction: column; gap: 10px;
    width: 260px; flex-shrink: 0;
  }
  .panel {
    background: #16213e;
    border-radius: 8px;
    padding: 12px;
    border: 1px solid #0f3460;
  }
  .panel h3 { font-size: 0.85rem; color: #a0c4ff; margin-bottom: 8px; }

  /* ── HUD: always-visible status / info / difficulty ── */
  #hud { display: flex; flex-direction: column; gap: 8px; }
  #status-text { font-size: 0.95rem; line-height: 1.4; font-weight: 600; }
  #info-text { font-size: 0.8rem; color: #aaa; line-height: 1.4; min-height: 18px; }
  .status-check { color: #ff6b6b; font-weight: bold; }
  .status-over { color: #ffd700; font-weight: bold; }
  .status-thinking { color: #90e0ef; font-style: italic; }
  .info-error { color: #ff6b6b; }
  .info-ok { color: #90ee90; }

  #depth-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; margin-bottom: 8px; }
  #depth-row label { color: #a0c4ff; white-space: nowrap; }
  #depth-row input[type=range] {
    flex: 1; min-width: 0;
    background: #0f3460; border: 1px solid #1a4a80;
    border-radius: 4px; padding: 2px;
  }
  #depth-val { color: #a0c4ff; min-width: 12px; text-align: center; }

  /* ── Drawer: New Game + Move History ── */
  #sidebar { display: flex; flex-direction: column; gap: 10px; }
  #drawer-head { display: none; }

  #setup-form label { display: block; font-size: 0.8rem; margin-bottom: 4px; }
  #setup-form select {
    width: 100%; margin-bottom: 8px;
    background: #0f3460; border: 1px solid #1a4a80;
    color: #e0e0e0; border-radius: 4px; padding: 6px;
  }
  #btn-new {
    width: 100%; padding: 10px;
    background: #0f3460; border: 1px solid #1a4a80;
    color: #a0c4ff; border-radius: 6px; cursor: pointer;
    font-size: 0.9rem;
  }
  #btn-new:hover { background: #1a4a80; }

  #move-list {
    font-size: 0.75rem; color: #ccc; max-height: 200px;
    overflow-y: auto; line-height: 1.8;
  }
  .move-pair { display: flex; gap: 8px; }
  .move-num { color: #666; min-width: 24px; }
  .move-white { color: #f0f0f0; }
  .move-black { color: #aaa; }

  /* ── Promotion chooser (floating overlay) ── */
  #promo-panel {
    display: none; position: fixed; z-index: 60;
    left: 50%; top: 40%; transform: translate(-50%, -50%);
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
    text-align: center;
  }
  #promo-panel h3 { color: #ffd700; }
  .promo-btn {
    display: inline-block; font-size: 34px; cursor: pointer;
    padding: 6px 10px; border-radius: 4px; transition: background 0.15s;
    color: #fff;
  }
  .promo-btn:hover { background: #1a4a80; }

  #backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.55); z-index: 40;
  }

  /* ── Mobile ── */
  @media (max-width: 720px) {
    body { padding: 8px; }
    #menu-toggle { display: block; }
    #topbar h1 { font-size: 1.15rem; }
    #main { flex-direction: column; align-items: stretch; gap: 10px; }
    #board-container { display: flex; justify-content: center; width: 100%; }
    svg#board { width: 100%; height: auto; max-height: 58vh; }
    #rightcol { width: 100%; }

    #sidebar {
      position: fixed; top: 0; right: 0; height: 100%;
      width: 84%; max-width: 320px;
      background: #12182f; padding: 14px;
      transform: translateX(100%); transition: transform .25s ease;
      z-index: 50; overflow-y: auto;
      box-shadow: -4px 0 24px rgba(0,0,0,.5);
    }
    #sidebar.open { transform: translateX(0); }
    #drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    #drawer-head span { font-size: 1rem; color: #a0c4ff; font-weight: 600; }
    #drawer-close {
      background: none; border: none; color: #a0c4ff;
      font-size: 1.4rem; cursor: pointer; line-height: 1;
    }
    #backdrop.show { display: block; }
  }
</style>
</head>
<body>
<div id="topbar">
  <h1><a href="https://en.wikipedia.org/wiki/Hexagonal_chess#Gli%C5%84ski's_hexagonal_chess" target="_blank" rel="noopener noreferrer">Glinski's Hexagonal Chess</a></h1>
  <button id="menu-toggle" aria-label="Open menu">☰</button>
</div>
<div id="main">
  <div id="board-container">
    <svg id="board"></svg>
  </div>

  <div id="rightcol">
    <!-- Always-visible HUD: status, info, difficulty -->
    <div class="panel" id="hud">
      <div id="status-text">Loading…</div>
      <div id="info-text">Open the menu to start a game.</div>
    </div>

    <!-- Drawer: New Game + Move History (hamburger on mobile) -->
    <div id="sidebar">
      <div id="drawer-head">
        <span>Menu</span>
        <button id="drawer-close" aria-label="Close menu">✕</button>
      </div>

      <div class="panel" id="setup-panel">
        <h3>New Game</h3>
        <div id="setup-form">
          <label>Play as</label>
          <select id="sel-color">
            <option value="white">White (moves first)</option>
            <option value="black">Black</option>
          </select>
          <div id="depth-row">
            <label for="sel-depth">AI depth</label>
            <input type="range" id="sel-depth" min="2" max="4" value="3">
            <span id="depth-val">3</span>
          </div>
          <button id="btn-new">Start / Restart</button>
        </div>
      </div>

      <div class="panel">
        <h3>Move History</h3>
        <div id="move-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- Promotion chooser (floating overlay) -->
<div class="panel" id="promo-panel">
  <h3>Promote Pawn To:</h3>
  <div id="promo-choices"></div>
</div>

<!-- Drawer backdrop -->
<div id="backdrop"></div>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const HEX_SIZE = 30;       // center-to-corner distance
const BOARD_PAD = 40;
const sqrt3 = Math.sqrt(3);
const ANIM_MS = 380;       // piece-glide animation duration

// Flat-top hex: x = HEX_SIZE * 1.5 * q,  y = HEX_SIZE * sqrt3 * (r + q/2)
// Screen: flip y (higher r = higher on board = lower screen y)
function hexCenter(q, r) {
  const x = HEX_SIZE * 1.5 * q;
  const y = -HEX_SIZE * sqrt3 * (r + q / 2);
  return { x, y };
}

// Corners of a flat-top hex at (cx, cy)
function hexCorners(cx, cy, size) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const ang = (Math.PI / 180) * (60 * i);
    pts.push([cx + size * Math.cos(ang), cy + size * Math.sin(ang)]);
  }
  return pts;
}

const COLORS = ['#E8D8A8', '#8FAF70', '#C8A060'];  // light, medium, dark
const SEL_COLOR    = '#4488FF';
const VALID_COLOR  = '#44CC44';
const LAST_COLOR   = '#FFCC44';

// Use the proper per-colour glyphs (white = outline, black = filled) rather
// than colouring one filled glyph via `fill`. iOS Safari renders some filled
// chess glyphs (notably the pawn ♟, U+265F) as a dark emoji that ignores the
// SVG fill, which made white pawns appear black. The outline glyphs are light
// whether drawn as text or emoji, so white pieces read correctly everywhere.
const UNICODE = {
  'white': { king:'♔', queen:'♕', rook:'♖', bishop:'♗', knight:'♘', pawn:'♙' },
  'black': { king:'♚', queen:'♛', rook:'♜', bishop:'♝', knight:'♞', pawn:'♟' },
};

const PROMO_PIECES = ['queen','rook','bishop','knight'];

// ─── State ───────────────────────────────────────────────────────────────────
let cellColors = {};    // notation → 0|1|2
let gameState  = null;  // from server
let selected   = null;  // notation of selected cell
let validMoves = [];    // array of destination notations
let lastMove   = null;  // {from, to}
let pendingPromo = null;// {from, to} awaiting promotion choice
let moveHistory  = [];  // [{white, black}]
let currentMoveWhite = null;
let playerColor = 'white';
let thinking = false;

// ─── SVG helpers ─────────────────────────────────────────────────────────────
const svgNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const el = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// ─── Board initialisation ────────────────────────────────────────────────────
async function initBoard() {
  const resp = await fetch('/api/cells');
  cellColors = await resp.json();

  // Compute bounding box
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const cell of Object.keys(cellColors)) {
    const [q, r] = cellToAxial(cell);
    const { x, y } = hexCenter(q, r);
    minX = Math.min(minX, x - HEX_SIZE);
    maxX = Math.max(maxX, x + HEX_SIZE);
    minY = Math.min(minY, y - HEX_SIZE * sqrt3 / 2);
    maxY = Math.max(maxY, y + HEX_SIZE * sqrt3 / 2);
  }
  const W = maxX - minX + BOARD_PAD * 2;
  const H = maxY - minY + BOARD_PAD * 2;
  const offX = -minX + BOARD_PAD;
  const offY = -minY + BOARD_PAD;

  const svg = document.getElementById('board');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // Draw cells
  for (const [cell, colorIdx] of Object.entries(cellColors)) {
    const [q, r] = cellToAxial(cell);
    const { x, y } = hexCenter(q, r);
    const cx = x + offX, cy = y + offY;
    const corners = hexCorners(cx, cy, HEX_SIZE - 0.5);
    const pts = corners.map(([px,py]) => `${px},${py}`).join(' ');

    const g = svgEl('g', { class: 'hex-cell', 'data-cell': cell });

    const poly = svgEl('polygon', {
      class: 'hex-bg',
      points: pts,
      fill: COLORS[colorIdx],
      'data-base-color': COLORS[colorIdx],
    });
    g.appendChild(poly);

    // Small label
    const lbl = svgEl('text', {
      class: 'hex-label',
      x: cx, y: cy + HEX_SIZE * 0.62,
      fill: '#555',
    });
    lbl.textContent = cell;
    g.appendChild(lbl);

    // Piece text placeholder
    const pt = svgEl('text', {
      class: 'hex-piece',
      x: cx, y: cy,
      fill: '#111',
    });
    g.appendChild(pt);

    g.addEventListener('click', () => onCellClick(cell));
    svg.appendChild(g);
  }

  // Store offsets for later
  svg._offX = offX;
  svg._offY = offY;
}

// ─── Rendering ───────────────────────────────────────────────────────────────
function renderBoard() {
  if (!gameState) return;
  const pieces = gameState.pieces || {};
  const svg = document.getElementById('board');

  for (const g of svg.querySelectorAll('.hex-cell')) {
    const cell = g.dataset.cell;
    const poly = g.querySelector('.hex-bg');
    const pieceEl = g.querySelector('.hex-piece');

    // Color
    let bg = COLORS[cellColors[cell]];
    if (lastMove && (cell === lastMove.from || cell === lastMove.to)) bg = LAST_COLOR;
    if (validMoves.includes(cell)) bg = VALID_COLOR;
    if (cell === selected) bg = SEL_COLOR;
    poly.setAttribute('fill', bg);

    // Piece
    const p = pieces[cell];
    if (p) {
      const sym = UNICODE[p.color]?.[p.piece] || '?';
      pieceEl.textContent = sym;
      pieceEl.setAttribute('fill', p.color === 'white' ? '#fff' : '#222');
      pieceEl.setAttribute('stroke', p.color === 'white' ? '#222' : '#ccc');
      pieceEl.setAttribute('stroke-width', '1');
      pieceEl.setAttribute('paint-order', 'stroke');
    } else {
      pieceEl.textContent = '';
    }
  }
}

// Screen center (in SVG viewBox coords) of a cell.
function cellCenter(cell) {
  const svg = document.getElementById('board');
  const [q, r] = cellToAxial(cell);
  const { x, y } = hexCenter(q, r);
  return { x: x + svg._offX, y: y + svg._offY };
}

// Glide a piece from one cell to another. Hides the source piece for the
// duration of the flight; the caller is responsible for updating the board
// state (so the piece appears at the destination) once this resolves.
function flyPiece(from, to, color, pieceType) {
  return new Promise(resolve => {
    const svg = document.getElementById('board');
    const a = cellCenter(from), b = cellCenter(to);

    // Hide the piece sitting on the source cell while it "flies".
    const srcPiece = svg.querySelector(`.hex-cell[data-cell="${from}"] .hex-piece`);
    if (srcPiece) srcPiece.textContent = '';

    const fl = svgEl('text', {
      class: 'hex-piece',
      x: 0, y: 0,
      fill: color === 'white' ? '#fff' : '#222',
      stroke: color === 'white' ? '#222' : '#ccc',
      'stroke-width': '1',
      'paint-order': 'stroke',
    });
    fl.textContent = UNICODE[color]?.[pieceType] || '?';
    fl.style.transition = 'none';
    fl.style.transform = `translate(${a.x}px, ${a.y}px)`;
    svg.appendChild(fl);

    // Force a reflow so the starting transform is committed before we animate.
    fl.getBoundingClientRect();
    fl.style.transition = `transform ${ANIM_MS}ms cubic-bezier(0.25, 0.1, 0.25, 1)`;
    requestAnimationFrame(() => {
      fl.style.transform = `translate(${b.x}px, ${b.y}px)`;
    });

    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      fl.remove();
      resolve();
    };
    fl.addEventListener('transitionend', finish);
    setTimeout(finish, ANIM_MS + 150);  // fallback if transitionend doesn't fire
  });
}

function setStatus() {
  if (!gameState) return;
  const el = document.getElementById('status-text');
  if (gameState.game_over) {
    let msg = '';
    if (gameState.winner === 'white') msg = '♔ White wins';
    else if (gameState.winner === 'black') msg = '♚ Black wins';
    else msg = 'Draw';
    if (gameState.result_reason) msg += ` (${gameState.result_reason})`;
    el.innerHTML = `<span class="status-over">${msg}</span>`;
  } else if (thinking) {
    el.innerHTML = `<span class="status-thinking">AI is thinking…</span>`;
  } else {
    const whose = gameState.turn === gameState.player_color ? 'Your turn' : "AI's turn";
    let msg = `${whose} (${capitalize(gameState.turn)})`;
    if (gameState.in_check) msg += ' — <span class="status-check">CHECK!</span>';
    el.innerHTML = msg;
  }
}

function setInfo(msg, type='') {
  const el = document.getElementById('info-text');
  el.className = type ? `info-${type}` : '';
  el.textContent = msg;
}

// ─── Click handling ───────────────────────────────────────────────────────────
async function onCellClick(cell) {
  if (!gameState || gameState.game_over || thinking) return;
  if (gameState.turn !== gameState.player_color) return;

  if (pendingPromo) return;  // waiting for promotion choice

  // If clicking the already-selected cell: deselect
  if (cell === selected) {
    selected = null;
    validMoves = [];
    setInfo('Deselected.');
    renderBoard();
    return;
  }

  const piece = gameState.pieces[cell];

  // If we have a selection and click a destination
  if (selected !== null) {
    if (validMoves.includes(cell)) {
      // Check if promotion needed
      const needsPromo = await checkNeedsPromotion(selected, cell);
      if (needsPromo) {
        pendingPromo = { from: selected, to: cell };
        showPromoChooser();
        return;
      }
      await submitMove(selected, cell, null);
      return;
    } else {
      // Click on own piece → switch selection
      if (piece && piece.color === gameState.player_color) {
        await selectCell(cell);
        return;
      }
      // Click on invalid destination → show reason
      const reason = await fetchIllegalReason(selected, cell);
      setInfo(reason || 'Illegal move.', 'error');
      return;
    }
  }

  // Nothing selected yet
  if (!piece) {
    setInfo('No piece on that cell.', 'error');
    return;
  }
  if (piece.color !== gameState.player_color) {
    setInfo("That is your opponent's piece.", 'error');
    return;
  }
  await selectCell(cell);
}

async function selectCell(cell) {
  selected = cell;
  const resp = await fetch('/api/select', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({cell}),
  });
  const data = await resp.json();
  validMoves = data.valid_moves || [];
  if (validMoves.length === 0) {
    setInfo(data.reason || 'No legal moves for this piece.', 'error');
  } else {
    setInfo(`${validMoves.length} legal move(s) available. Click a green cell.`, 'ok');
  }
  renderBoard();
}

async function checkNeedsPromotion(from, to) {
  const resp = await fetch('/api/select', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({cell: from}),
  });
  const data = await resp.json();
  return !!data.requires_promotion && data.valid_moves.includes(to);
}

async function fetchIllegalReason(from, to) {
  const resp = await fetch('/api/check_move', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({from_cell: from, to_cell: to}),
  });
  const data = await resp.json();
  return data.reason || 'Illegal move.';
}

// Optimistically apply a move to the local board so the piece can be shown at
// its destination before the server round-trip completes. The exact position
// is reconciled from the server response afterwards.
function applyLocalMove(from, to, promotion) {
  if (!gameState || !gameState.pieces) return;
  const p = gameState.pieces[from];
  if (!p) return;
  delete gameState.pieces[from];
  gameState.pieces[to] = promotion ? { color: p.color, piece: promotion } : p;
}

async function submitMove(from, to, promotion) {
  selected = null;
  validMoves = [];
  setInfo('');
  // Lock input immediately. We don't call setStatus() yet, so "AI is thinking…"
  // won't appear until the player's piece has actually moved.
  thinking = true;

  const mover = gameState.pieces[from];
  const moverColor = mover ? mover.color : gameState.player_color;
  const moverType  = mover ? mover.piece : 'pawn';

  // Fire the request now so the AI can think while the player's piece glides.
  const movePromise = fetch('/api/move', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({from_cell: from, to_cell: to, promotion}),
  }).then(r => r.json());

  // 1. Move the player's piece right away.
  await flyPiece(from, to, moverColor, moverType);
  applyLocalMove(from, to, promotion);
  lastMove = {from, to};
  renderBoard();

  // 2. Only now does the AI start "thinking" from the player's perspective.
  setStatus();

  const data = await movePromise;

  if (!data.success) {
    thinking = false;
    setInfo(data.reason || 'Illegal move.', 'error');
    gameState = data;           // revert to the server's (unchanged) position
    lastMove = null;
    renderBoard();
    setStatus();
    return;
  }

  // Reconcile to the exact position after the human's move (captures,
  // en passant, promotion that the optimistic render can't fully know).
  if (data.state_after_human) {
    gameState = data.state_after_human;
    lastMove = {from, to};
    renderBoard();
  }

  // 3. Animate the AI's reply.
  if (data.ai_move) {
    const aiFrom = data.ai_move.from, aiTo = data.ai_move.to;
    const aiPiece = gameState.pieces[aiFrom];
    const aiColor = aiPiece ? aiPiece.color
                            : (gameState.player_color === 'white' ? 'black' : 'white');
    const aiType  = aiPiece ? aiPiece.piece : 'pawn';
    await flyPiece(aiFrom, aiTo, aiColor, aiType);
    lastMove = {from: aiFrom, to: aiTo};
  }

  thinking = false;
  gameState = data;
  renderBoard();
  setStatus();

  // Record moves in history.
  const moveStr = promotion ? `${from}-${to}=${promotion[0].toUpperCase()}` : `${from}-${to}`;
  recordMove(moveStr, gameState.player_color === 'white' ? 'white' : 'black');
  if (data.ai_move) {
    const aiStr = data.ai_move.promotion
      ? `${data.ai_move.from}-${data.ai_move.to}=${data.ai_move.promotion[0].toUpperCase()}`
      : `${data.ai_move.from}-${data.ai_move.to}`;
    recordMove(aiStr, gameState.player_color === 'white' ? 'black' : 'white');
  }

  setInfo('Move made.', 'ok');
  if (gameState.game_over) {
    setInfo('Game over! Start a new game above.', 'ok');
  }
}

function showPromoChooser() {
  const panel = document.getElementById('promo-panel');
  const choices = document.getElementById('promo-choices');
  panel.style.display = 'block';
  choices.innerHTML = '';
  const color = gameState.player_color;
  for (const piece of PROMO_PIECES) {
    const span = document.createElement('span');
    span.className = 'promo-btn';
    span.textContent = UNICODE[color][piece];
    span.title = capitalize(piece);
    span.onclick = async () => {
      panel.style.display = 'none';
      const { from, to } = pendingPromo;
      pendingPromo = null;
      await submitMove(from, to, piece);
    };
    choices.appendChild(span);
  }
}

// ─── Move history ─────────────────────────────────────────────────────────────
function recordMove(notation, color) {
  const list = document.getElementById('move-list');
  if (color === 'white' || (gameState.player_color === 'black' && color === 'black')) {
    // Start new move pair
    currentMoveWhite = notation;
    const div = document.createElement('div');
    div.className = 'move-pair';
    div.innerHTML = `<span class="move-num">${gameState.fullmove}.</span>
      <span class="move-white" id="mw-${gameState.fullmove}">${notation}</span>
      <span class="move-black" id="mb-${gameState.fullmove}"></span>`;
    list.appendChild(div);
  } else {
    const mb = document.getElementById(`mb-${gameState.fullmove - (gameState.turn === 'white' ? 0 : 1)}`);
    if (mb) mb.textContent = notation;
  }
  list.scrollTop = list.scrollHeight;
}

// ─── New game ─────────────────────────────────────────────────────────────────
async function startNewGame() {
  const color = document.getElementById('sel-color').value;
  const depth = parseInt(document.getElementById('sel-depth').value);
  closeDrawer();  // reveal the board after starting from the menu
  playerColor = color;
  selected = null;
  validMoves = [];
  lastMove = null;
  pendingPromo = null;
  moveHistory = [];
  currentMoveWhite = null;
  document.getElementById('move-list').innerHTML = '';
  document.getElementById('promo-panel').style.display = 'none';
  setInfo('Game started. Click a piece to select it.', 'ok');

  thinking = true;
  setStatus();

  const resp = await fetch('/api/new_game', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({player_color: color, depth}),
  });
  gameState = await resp.json();
  thinking = false;
  renderBoard();
  setStatus();
}

// ─── Utilities ────────────────────────────────────────────────────────────────
const FILES = ['a','b','c','d','e','f','g','h','i','k','l'];

function cellToAxial(notation) {
  const file = notation[0];
  const rank = parseInt(notation.slice(1));
  const q = FILES.indexOf(file) - 5;
  const r = rank - 6 - Math.min(0, q);
  return [q, r];
}

function capitalize(s) {
  return s ? s[0].toUpperCase() + s.slice(1) : '';
}

// ─── Drawer (hamburger menu) ──────────────────────────────────────────────────
function openDrawer() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
}
function closeDrawer() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
document.getElementById('menu-toggle').addEventListener('click', openDrawer);
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('backdrop').addEventListener('click', closeDrawer);

document.getElementById('sel-depth').addEventListener('input', function() {
  document.getElementById('depth-val').textContent = this.value;
});
// Apply a depth change to the in-progress game (not just the next one).
document.getElementById('sel-depth').addEventListener('change', async function() {
  try {
    await fetch('/api/set_depth', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({depth: parseInt(this.value)}),
    });
  } catch (e) { /* non-critical: will still apply on next new game */ }
});
document.getElementById('btn-new').addEventListener('click', startNewGame);

(async () => {
  await initBoard();
  // Load existing state
  const resp = await fetch('/api/state');
  gameState = await resp.json();
  renderBoard();
  setStatus();
  setInfo('Open the menu (☰) to start a game.');
})();
</script>
